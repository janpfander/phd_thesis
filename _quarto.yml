  author: "Jan Pfänder"
  date: "4/15/2025"
  cover-image: cover/couverture.jpeg
  chapters:
    - index.qmd
    - summary.qmd
    - intro.qmd
    - everyone_trusts_science_abit/everyone_trusts_science_abit.qmd
    - impressive_science/impressive_science.qmd
    - consensus_trust/consensus_trust.qmd
    - trust_science_france/trust_science_france.qmd
    - meta_news_judgement/meta_news_judgement.qmd
    - references.qmd
  search: true
  repo-url: https://github.com/jjallaire/hopr/
  repo-actions: [edit]
  downloads: [pdf, epub]

bibliography: 
