  - consensus_trust/references.bib  
  - everyone_trusts_science_abit/references.bib
  - impressive_science/references.bib  
  - trust_science_france/bibliography.bib
  # bibliography are in-text citations, references are studies included in meta-analysis
  - meta_news_judgement/references.bib  
  - meta_news_judgement/bibliography.bib 
  
format:
